name: Release

on:
  push:
    tags: ["v*", "!v*-beta-*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the version and release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version mygo.json)"
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" != tag ] || [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::$GITHUB_REF_NAME does not match mygo.json version $version (expected tag $tag)."
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 &&
            [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]; then
            echo "::error::Release $tag is already published; refusing to replace its assets."
            exit 1
          fi
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
      - name: Write release notes
        env:
          RELEASE_NOTES: ${{ steps.cliff.outputs.content }}
        run: |
          version="$(jq -r .version mygo.json)"
          mkdir -p release-notes
          printf '%s\n' "$RELEASE_NOTES" > release-notes/release-notes.md
          if ! grep -q '[^[:space:]]' release-notes/release-notes.md; then
            printf 'Builds for Windows.\n' > release-notes/release-notes.md
          fi
          { printf '## %s\n\n' "$version"; cat release-notes/release-notes.md; } > release-notes/CHANGELOG.md
          cat release-notes/release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes/
          if-no-files-found: error

  build:
    needs: release-notes
    name: build windows/amd64
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cache NSIS
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\mygo\nsis-*
          key: nsis-${{ hashFiles('go.sum') }}
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: release-notes
      - name: Use the release notes for the update window
        run: |
          jq '.updates.changelog = "release-notes/CHANGELOG.md"' mygo.json > mygo.json.notes
          mv mygo.json.notes mygo.json
      - name: Build Windows client
        run: go tool mygo build -platform windows/amd64
      - name: Package Windows portable ZIP
        run: python .github/windows-portable.py build/windows-amd64 amd64
      - name: Collect release assets
        run: |
          shopt -s nullglob
          dir="build/windows-amd64"
          mkdir -p dist
          files=("$dir"/*-setup-*.exe "$dir"/*-portable.zip "$dir"/*.delta "$dir"/update-*.json)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::No release assets found"; exit 1; }
          cp "${files[@]}" dist/
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: assets-windows-amd64
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [release-notes, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: assets-windows-amd64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: release-notes
      - name: Write checksums
        run: |
          sums="$(cd dist && sha256sum -- *)"
          printf '%s\n' "$sums" > dist/SHA256SUMS
          cat dist/SHA256SUMS
      - name: Append download links to the release notes
        run: bash .github/release-download-notes.sh dist "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" >> release-notes/release-notes.md
      - name: Create and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ] || {
              echo "::error::Release $tag is already published; refusing to replace its assets."
              exit 1
            }
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$tag" --notes-file release-notes/release-notes.md
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
