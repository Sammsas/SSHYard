name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build windows/amd64
    if: "!startsWith(github.event.head_commit.message, 'chore(release): bump version to ')"
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cache NSIS
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\mygo\nsis-*
          key: nsis-${{ hashFiles('go.sum') }}
      - name: Check and test
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "::error::gofmt needed on:"; echo "$out"; exit 1; fi
          go vet ./...
          go test -count=1 ./...
      - name: Build Windows client
        run: go tool mygo build -platform windows/amd64
      - name: Package Windows portable ZIP
        run: |
          python .github/windows-portable-test.py
          python .github/windows-portable.py build/windows-amd64 amd64
      - name: List outputs
        run: ls -la build/windows-amd64
      - uses: actions/upload-artifact@v7
        with:
          name: sshyard-windows-amd64
          retention-days: 7
          if-no-files-found: error
          path: |
            build/windows-amd64/*-setup-*.exe
            build/windows-amd64/*-portable.zip
            build/windows-amd64/update-*.json
