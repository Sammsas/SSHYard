name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    if: "!startsWith(github.event.head_commit.message, 'chore(release): bump version to ')"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, goos: windows, goarch: amd64 }
          - { os: macos-latest, goos: darwin, goarch: arm64 }
          - { os: macos-latest, goos: darwin, goarch: amd64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cache NSIS
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\mygo\nsis-*
          key: nsis-${{ hashFiles('go.sum') }}
      # gofmt on a Windows checkout sees CRLF (core.autocrlf) on every
      # file, so formatting and vet run on the macOS job (LF checkout).
      - name: gofmt and vet
        if: matrix.goos == 'darwin' && matrix.goarch == 'arm64'
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "::error::gofmt needed on:"; echo "$out"; exit 1; fi
          go vet ./...
      - name: Test
        if: matrix.goos == 'windows'
        run: go test -count=1 ./...
      - name: Build client
        run: go tool mygo build -platform "${{ matrix.goos }}/${{ matrix.goarch }}"
      - name: Package Windows portable ZIP
        if: runner.os == 'Windows'
        run: |
          python .github/windows-portable-test.py
          python .github/windows-portable.py "build/${{ matrix.goos }}-${{ matrix.goarch }}" "${{ matrix.goarch }}"
      - name: List outputs
        run: ls -la "build/${{ matrix.goos }}-${{ matrix.goarch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: sshyard-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/${{ matrix.goos }}-${{ matrix.goarch }}/*.dmg
            build/${{ matrix.goos }}-${{ matrix.goarch }}/*-setup-*.exe
            build/${{ matrix.goos }}-${{ matrix.goarch }}/*-portable.zip
            build/${{ matrix.goos }}-${{ matrix.goarch }}/update-*.json
